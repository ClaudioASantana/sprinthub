version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sprinthub_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-sprinthub_dev}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-sprinthub_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sprinthub_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin_password}@postgres:5432/${POSTGRES_DB:-sprinthub_dev}
      PORT: 3005
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
      GO_AUTH_URL: ${GO_AUTH_URL}
      GO_CLIENT_ID: ${GO_CLIENT_ID}
      GO_CLIENT_SECRET: ${GO_CLIENT_SECRET}
      GO_REDIRECT_URI: ${GO_REDIRECT_URI}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-false}
    container_name: sprinthub_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: sprinthub_postgres_data
